<div class="wrapper">
  @if (loading) {
    <div class="spinner-overlay">
      <div class="spinner"></div>
      <p class="spinner-text">Loading document viewer&hellip;</p>
    </div>
  }
  @if (error) {
    <div class="error-banner" role="alert">{{ error }}</div>
  }
  <div #viewer class="viewer"></div>
</div>
